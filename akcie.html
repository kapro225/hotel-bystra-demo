  <script>
    // =====================================================
    // UPRAVUJ TU — stačí zmeniť údaje nižšie
    // Pridaj nový blok { } pre novú akciu
    // Na konci JSON databloku daj čiarku ak pridávaš ďalší
    // =====================================================
    const akcie = [
      {
        "nazov": "Ponuka šéfkuchára",
        "popis": "Špeciálna ponuka každý deň od 15:00. Rebrá, medailóniky, šaláty a dezerty z čerstvých surovín.",
        "obrazok": "static/images/akcie/ristorante-al-lago-PONUKA-SEFKUCHARA-leto-2026-1448x2048.jpg",
        "obrazokAlt": "Špeciálna ponuka šéfkuchára — grilované rebrá, medailóniky a čerstvé šaláty v Reštaurácii Al Lago",
        "datum": "2026-08-24"
      },

    ];
    // =====================================================
    // KONIEC — nižšie nič nemeň
    // =====================================================

    const list = document.getElementById('events-list');

    if (akcie.length === 0) {
      list.innerHTML = '<div class="no-events"><p>Zatiaľ žiadne akcie</p></div>';
    } else {
      list.innerHTML = akcie.map(a => {
        const img = a.obrazok
          ? `<img src="${a.obrazok}" alt="${a.obrazokAlt || a.nazov}" class="event-image" width="800" height="450" loading="lazy">`
          : '';
        const date = a.datum
          ? `<p class="event-date">${new Date(a.datum).toLocaleDateString('sk-SK', { day: 'numeric', month: 'long', year: 'numeric' })}</p>`
          : '';
        return `
          <article class="event-card">
            ${date}
            <h2 class="event-title">${a.nazov}</h2>
            <p class="event-desc">${a.popis}</p>
            ${img}
          </article>
        `;
      }).join('');
    }
  </script>
